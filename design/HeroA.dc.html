<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Hero B — частицы собираются в конфету</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;family=Nunito:wght@400..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#260307}
*,*::before,*::after{box-sizing:border-box}
.kf-d{font-family:'Comfortaa','Nunito',ui-rounded,sans-serif}
.kf-mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
</style>
</helmet>
<div data-hb-root style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #260307; color: #F6EDE6; font-family: 'Nunito', ui-rounded, sans-serif">
<canvas data-hb="canvas" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 0 56px 56px; pointer-events: none">
<div style="display: flex; align-items: center; justify-content: space-between; height: 76px; border-bottom: 1px solid rgba(246,237,230,.1); pointer-events: auto">
<span class="kf-d" style="font-weight: 700; font-size: 18px">konfeta <span style="font-weight: 400; color: #D9C6C2">running club</span></span>
<div style="display: flex; gap: 28px; font-size: 15px; font-weight: 600; color: #D9C6C2"><span>Как бегаем</span><span>Где</span><span>Фото</span><span>Вопросы</span></div>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: {{accent}}; color: #260307; font-weight: 800; font-size: 15px; text-decoration: none">Пробежать с нами →</a>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; max-width: 640px; pointer-events: auto">
<span class="kf-mono" style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #A88784">Женский беговой клуб · Москва</span>
<h1 class="kf-d" style="margin: 0; font-size: 84px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em">Бегаем медленно. Болтаем много.</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.55; color: #D9C6C2">Начинали несколько соседок на Шелепихинской набережной — сейчас нас больше 10. Пробежки бесплатные.</p>
<div style="display: flex; gap: 12px">
<a href="#" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; background: {{accent}}; color: #260307; font-weight: 800; font-size: 17px; text-decoration: none">Пробежать с нами →</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 24px; border-radius: 999px; border: 1px solid rgba(246,237,230,.35); color: #F6EDE6; font-weight: 700; font-size: 17px; text-decoration: none">Где бегаем</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9CC2","options":["#FF9CC2","#FFB36B","#9FE8C8"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF9CC2' };
  }

  componentDidMount() {
    var self = this;
    this._alive = true; this._tries = 0;
    this._initFn = function () { self.init(); };
    setTimeout(this._initFn, 30);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._off) this._off();
  }

  sample() {
    var segs = [], i, a, th1 = Math.PI * 2 * 2.55;
    var ring = [], sp = [];
    for (i = 0; i <= 120; i++) { a = i / 120 * Math.PI * 2; ring.push([50 + Math.cos(a) * 38, 45 + Math.sin(a) * 38]); }
    for (i = 0; i <= 140; i++) { var th = th1 * i / 140, r = 2 + 28 * (th / th1), ph = Math.PI / 2 + Math.PI * 0.08 - (th1 - th); sp.push([50 + r * Math.cos(ph), 45 + r * Math.sin(ph)]); }
    segs.push({ pts: ring, spin: true, acc: false });
    segs.push({ pts: sp, spin: true, acc: true });
    segs.push({ pts: [[50, 84], [50, 126]], spin: false, acc: false });
    segs.push({ pts: [[33, 108], [67, 108]], spin: false, acc: false });
    var all = [], total = 0;
    segs.forEach(function (s) { for (var k = 1; k < s.pts.length; k++) { var p = s.pts[k - 1], q = s.pts[k], L = Math.hypot(q[0] - p[0], q[1] - p[1]); all.push({ p: p, q: q, L: L, spin: s.spin, acc: s.acc }); total += L; } });
    var N = 1700, out = [], step = total / N, acc = 0, idx = 0, off = 0;
    for (var n = 0; n < N; n++) {
      var d = n * step;
      while (idx < all.length - 1 && acc + all[idx].L < d) { acc += all[idx].L; idx++; }
      var sg = all[idx], u = sg.L ? (d - acc) / sg.L : 0;
      var jx = (Math.random() - 0.5) * 5, jy = (Math.random() - 0.5) * 5;
      out.push({ lx: sg.p[0] + (sg.q[0] - sg.p[0]) * u + jx, ly: sg.p[1] + (sg.q[1] - sg.p[1]) * u + jy, spin: sg.spin, acc: sg.acc });
    }
    return out;
  }

  init() {
    var self = this;
    if (!this._alive) return;
    var c = document.querySelector('[data-hb="canvas"]'), root = document.querySelector('[data-hb-root]');
    if (!c || !root) { if (this._tries++ < 60) setTimeout(this._initFn, 50); return; }
    this.c = c; this.ctx = c.getContext('2d');
    var rm = false; try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    this.reduced = rm;
    var W = c.clientWidth || 1440, H = c.clientHeight || 900;
    this.parts = this.sample().map(function (p) {
      return { lx: p.lx, ly: p.ly, spin: p.spin, acc: p.acc, x: rm ? 0 : Math.random() * W, y: rm ? 0 : Math.random() * H, vx: 0, vy: 0, seed: Math.random() * 6.28 };
    });
    this.placed = rm; this.ang = 0; this.mx = -9999; this.my = -9999; this.t0 = performance.now();
    var move = function (e) { var r = c.getBoundingClientRect(); self.mx = (e.clientX - r.left) * (c.clientWidth / r.width); self.my = (e.clientY - r.top) * (c.clientHeight / r.height); };
    var leave = function () { self.mx = -9999; self.my = -9999; };
    root.addEventListener('pointermove', move); root.addEventListener('pointerleave', leave);
    this._off = function () { root.removeEventListener('pointermove', move); root.removeEventListener('pointerleave', leave); };
    this._loop = function (t) { self.frame(t); };
    this._raf = requestAnimationFrame(this._loop);
  }

  frame(t) {
    if (!this._alive) return;
    var c = this.c, ctx = this.ctx;
    var w = c.clientWidth || 1440, h = c.clientHeight || 900;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var dt = Math.min(64, t - (this._lt || t)) || 16; this._lt = t;
    var R = this.reduced;
    if (!R) this.ang += dt * 0.00025;
    var S = Math.min(h * 0.72 / 130, w * 0.4 / 100), ox = w * 0.7 - 50 * S, oy = h * 0.53 - 65 * S;
    var ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    var ramp = Math.min(1, (t - this.t0) / 1800), k = 0.012 + 0.05 * ramp * ramp;
    var acc = this.props.accent ?? '#FF9CC2';
    var cream = [], pink = [];
    for (var i = 0; i < this.parts.length; i++) {
      var p = this.parts[i], lx = p.lx, ly = p.ly;
      if (p.spin) { var dx0 = lx - 50, dy0 = ly - 45; lx = 50 + dx0 * ca - dy0 * sa; ly = 45 + dx0 * sa + dy0 * ca; }
      var bx = Math.sin(t * 0.0012 + p.seed) * 1.6, by = Math.cos(t * 0.001 + p.seed) * 1.6;
      var tx = ox + lx * S + bx, ty = oy + ly * S + by;
      if (R) { p.x = tx; p.y = ty; }
      else {
        p.vx += (tx - p.x) * k; p.vy += (ty - p.y) * k;
        var dx = p.x - this.mx, dy = p.y - this.my, d2 = dx * dx + dy * dy;
        if (d2 < 22500 && d2 > 0.01) { var d = Math.sqrt(d2), f = (1 - d / 150) * 4.5; p.vx += dx / d * f; p.vy += dy / d * f; }
        p.vx *= 0.84; p.vy *= 0.84; p.x += p.vx; p.y += p.vy;
      }
      (p.acc ? pink : cream).push(p);
    }
    ctx.fillStyle = 'rgba(246,237,230,0.9)';
    for (i = 0; i < cream.length; i++) ctx.fillRect(cream[i].x - 1.2, cream[i].y - 1.2, 2.4, 2.4);
    ctx.fillStyle = acc;
    for (i = 0; i < pink.length; i++) ctx.fillRect(pink[i].x - 1.3, pink[i].y - 1.3, 2.6, 2.6);
    this._raf = requestAnimationFrame(this._loop);
  }
}
</script>
</body>
</html>
